<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Assignment Dashboard</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; color: #000; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* Setup Page */
    .setup-container { max-width: 600px; margin: 50px auto; background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); }
    .setup-container h1 { color: #333; margin-bottom: 10px; }
    .setup-container p { color: #666; margin-bottom: 30px; line-height: 1.6; }
    .form-group { margin-bottom: 25px; }
    .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; transition: border-color 0.3s; }
    .form-group input:focus { outline: none; border-color: #667eea; }
    .btn-primary { width: 100%; padding: 15px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
    .btn-primary:hover { background: #5568d3; transform: translateY(-2px); }
    .error-message { background: #ffe0e0; border-left: 4px solid #ff4757; padding: 15px; border-radius: 5px; margin-top: 20px; color: #d63031; }
    .success-message { background: #e0ffe0; border-left: 4px solid #2ecc71; padding: 15px; border-radius: 5px; margin-top: 20px; color: #27ae60; }
    .hidden { display: none; }

    /* Dashboard */
    header { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .header-content h1 { color: #333; font-size: 2.5em; margin-bottom: 10px; }
    .subtitle { color: #666; font-size: 1.1em; }
    .settings-btn { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 1em; cursor: pointer; transition: all 0.3s ease; }
    .filters { background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); text-align: center; }
    .assignments-grid { display: grid; gap: 20px; }
    .assignment-card { background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); border-left: 5px solid #667eea; transition: all 0.3s ease; }
    .assignment-card.overdue { border-left-color: #ff4757; background: rgba(255, 71, 87, 0.05); }
    .assignment-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .assignment-title { font-size: 1.4em; font-weight: 600; color: #333; flex: 1; }
    .assignment-type { padding: 5px 15px; border-radius: 20px; font-size: 0.85em; font-weight: 600; text-transform: uppercase; background: #667eea; color: white; }
    .course-name { color: #667eea; font-weight: 600; margin-bottom: 10px; font-size: 1.1em; }
    .assignment-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
    .assignment-priority { margin-top: 10px; }
    .priority-low { border-left-color: #2ecc71; }
    .priority-medium { border-left-color: #ffa502; }
    .priority-high { border-left-color: #ff4757; }
    #calendar { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <!-- Setup Page -->
  <div id="setupPage" class="setup-container">
    <h1>🎓 Canvas Dashboard Setup</h1>
    <p>Connect your Canvas account to view your assignments, quizzes, and exams all in one place.</p>
    <form id="setupForm">
      <div class="form-group">
        <label for="canvasUrl">Canvas URL</label>
        <input type="text" id="canvasUrl" value="https://canvas.instructure.com" required>
      </div>
      <div class="form-group">
        <label for="canvasToken">Canvas API Token</label>
        <input type="password" id="canvasToken" required>
      </div>
      <button type="submit" class="btn-primary" id="connectBtn">Connect to Canvas</button>
    </form>
    <div id="errorMessage" class="error-message hidden"></div>
    <div id="successMessage" class="success-message hidden"></div>
  </div>

  <!-- Dashboard Page -->
  <div id="dashboardPage" class="container hidden">
    <header>
      <div class="header-content">
        <h1>📚 Canvas Dashboard</h1>
        <p class="subtitle">Track your assignments, quizzes, and exams</p>
      </div>
      <button class="settings-btn" onclick="showSetup()">⚙️ Settings</button>
    </header>

    <div class="filters">
      <div>
        <label>Type:</label>
        <select id="typeFilter">
          <option value="all">All</option>
          <option value="assignment">Assignments</option>
          <option value="quiz">Quizzes</option>
          <option value="exam">Exams</option>
        </select>
      </div>
      <div>
        <label>Status:</label>
        <select id="statusFilter">
          <option value="all">All</option>
          <option value="upcoming">Upcoming</option>
          <option value="soon">Due Soon</option>
          <option value="overdue">Overdue</option>
        </select>
